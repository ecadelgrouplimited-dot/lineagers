# lineagrs.tech: Lineage website, downloads, and docs. Static files only; no upstreams.
#   /var/www/lineagrs/site   landing page, /downloads/, /install.sh
#   /var/www/lineagrs/docs   mdBook output (docs/book)
# Certificate: certbot --webroot, cert name "lineagrs.tech" (renewals use the port-80 ACME paths below).
# Note: no ipv6only= and no http2 on the shared :443 sockets, so other sites on this host are unaffected.

server {
    listen 80;
    listen [::]:80;
    server_name lineagrs.tech www.lineagrs.tech;
    root /var/www/lineagrs/site;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://lineagrs.tech$request_uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name docs.lineagrs.tech;
    root /var/www/lineagrs/docs;
    location /.well-known/acme-challenge/ { try_files $uri =404; }
    location / { return 301 https://docs.lineagrs.tech$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.lineagrs.tech;
    ssl_certificate /etc/letsencrypt/live/lineagrs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineagrs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://lineagrs.tech$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lineagrs.tech;
    ssl_certificate /etc/letsencrypt/live/lineagrs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineagrs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lineagrs/site;
    index index.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Readable in a browser before piping to sh.
    location = /install.sh { types { } default_type text/plain; expires -1; }
    location = /downloads/latest.txt { types { } default_type text/plain; expires -1; }
    # Released files never change.
    location ~ ^/downloads/[0-9][^/]*/ { expires 30d; }
    location / { try_files $uri $uri/ =404; expires 5m; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name docs.lineagrs.tech;
    ssl_certificate /etc/letsencrypt/live/lineagrs.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lineagrs.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/lineagrs/docs;
    index index.html;
    error_page 404 /404.html;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # mdBook uses inline scripts, so only framing is restricted here.
    add_header Content-Security-Policy "frame-ancestors 'none'" always;

    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    location / { try_files $uri $uri/ =404; expires 5m; }
}
