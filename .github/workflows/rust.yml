name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system packages
      # fontconfig: needed by plotters, a dev-dependency used by the finance examples
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1-dev pkg-config
    - name: Install Rust (stable)
      run: |
        rustup toolchain install stable --profile minimal
        rustup default stable
        rustc --version
    - name: Test core only (no default features)
      shell: bash
      run: |
        set -o pipefail
        cargo test --no-default-features 2>&1 | tee test-core.log || {
          grep -E "panicked|FAILED|^error|^---- " test-core.log | head -10 | sed 's/^/::error::/'
          exit 1
        }
    - name: Build all targets
      run: cargo build --all-targets --verbose
    - name: Build all targets (ml feature)
      run: cargo build --all-targets --features ml --verbose
    - name: Run tests
      shell: bash
      run: |
        set -o pipefail
        cargo test --features ml 2>&1 | tee test-ml.log || {
          grep -E "panicked|FAILED|^error|^---- " test-ml.log | head -10 | sed 's/^/::error::/'
          exit 1
        }
    - name: Build governance-ops app
      run: cargo build --manifest-path apps/governance-ops/Cargo.toml --verbose
    - name: Build guard-server and CLI
      run: |
        cargo build --manifest-path apps/guard-server/Cargo.toml --verbose
        cargo build --bin lineage
    - name: Guard server end-to-end
      shell: bash
      run: |
        export GUARD_ADMIN_TOKEN=$(openssl rand -hex 32)
        export GUARD_DATA_DIR=$RUNNER_TEMP/guard-data
        apps/guard-server/target/debug/guard-server > "$RUNNER_TEMP/guard-server.log" 2>&1 &
        sleep 2
        python3 apps/guard-server/clients/python/demo_agent.py | tee "$RUNNER_TEMP/demo.out"
        agent=$(ls $GUARD_DATA_DIR/agents/*.jsonl)
        key=$(curl -s http://127.0.0.1:9200/v1/public-key | python3 -c 'import sys,json;print(json.load(sys.stdin)["public_key"])')
        checkpoint=$(grep -o 'checkpoint to publish: [0-9]*:[0-9a-f]*' "$RUNNER_TEMP/demo.out" | awk '{print $4}')
        target/debug/lineage audit verify "$agent" --public-key "$key" --checkpoint "$checkpoint"
    - name: Lineage Mastery levels and templates
      shell: bash
      run: |
        set -e
        for n in 01_first_action 02_budgets 03_scars 04_approvals 06_audit; do cargo run -q --example mastery_$n; done
        for i in 1 2 3; do cargo run -q --example mastery_05_persistence; done
        cargo run -q --example mastery_05_persistence -- --reset
        export GUARD_DATA_DIR=$RUNNER_TEMP/lessons-data GUARD_BIND=127.0.0.1:9300 GUARD_URL=http://127.0.0.1:9300
        apps/guard-server/target/debug/guard-server > "$RUNNER_TEMP/lessons-server.log" 2>&1 &
        sleep 2
        python3 examples/python/lesson07_guard_server.py --auto-approve
        python3 examples/python/lesson08_llm_loop.py
        python3 examples/python/lesson09_binding.py
        cd "$RUNNER_TEMP"
        "$GITHUB_WORKSPACE/target/debug/lineage" new refund-bot
        (cd refund-bot && python3 agent.py --auto-approve && python3 -m unittest discover -s tests)
        "$GITHUB_WORKSPACE/target/debug/lineage" new deploy-bot --template rust
        cd deploy-bot
        printf '\n[patch.crates-io]\nlineage-rs = { path = "%s" }\n' "$GITHUB_WORKSPACE" >> Cargo.toml
        cargo run -q -- --yes
    - name: DeepSeek payments agent tests
      shell: bash
      run: |
        cd apps/deepseek-payments-agent
        python3 -m venv .venv
        .venv/bin/pip install -r requirements.txt
        .venv/bin/python -m unittest discover -s tests -v
    - name: Guarded agent tests
      shell: bash
      run: |
        cd apps/guarded-agent
        python3 -m venv .venv
        .venv/bin/pip install -r requirements.txt
        .venv/bin/python -m unittest discover -s tests -v
