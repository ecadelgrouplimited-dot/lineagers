<figure class="lx-fig"><svg viewBox="0 0 860 210" role="img" aria-label="Scars accumulate toward the limit: a failure adds 1, an unlisted tool adds 3, a hit rate limit adds 1, and a harmful outcome adds 10, which crosses the limit of 10 and terminates the agent."><defs><marker id="scars-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker><marker id="scars-aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkok" d="M0 0L10 5L0 10z"/></marker><marker id="scars-abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkbad" d="M0 0L10 5L0 10z"/></marker><marker id="scars-aacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="40" y="70" width="64" height="40" rx="4"/><text class="t tb" x="72.0" y="95" text-anchor="middle">+1</text><text class="s" x="72.0" y="130" text-anchor="middle">failure</text><rect class="bacc" x="104" y="70" width="192" height="40" rx="4"/><text class="t tb" x="200.0" y="95" text-anchor="middle">+3</text><text class="s" x="200.0" y="130" text-anchor="middle">unlisted tool</text><rect class="b" x="296" y="70" width="64" height="40" rx="4"/><text class="t tb" x="328.0" y="95" text-anchor="middle">+1</text><text class="s" x="328.0" y="130" text-anchor="middle">rate limit</text><rect class="bbad" x="360" y="70" width="384" height="40" rx="4"/><text class="t tb" x="552.0" y="95" text-anchor="middle">+10</text><text class="s" x="552.0" y="130" text-anchor="middle">harmful</text><text class="t tb" x="724" y="95" text-anchor="middle">…</text><polyline class="bad" points="680,44 680,124" stroke-dasharray="5 4"/><text class="t badt" x="680" y="36" text-anchor="middle">scar_limit = 10</text><text class="s" x="40" y="60" text-anchor="middle">0</text><text class="t badt" x="430" y="186" text-anchor="middle">score 15 ≥ 10 → terminated: every later request is denied</text></svg><figcaption>Scar weights add up toward the policy&#x27;s scar_limit. Crossing it terminates the agent, permanently.</figcaption></figure>
