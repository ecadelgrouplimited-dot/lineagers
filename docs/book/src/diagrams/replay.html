rker-end="url(#replay-a)"/><text class="s" x="542.0" y="83.0" text-anchor="middle">rebuild</text><text class="s badt" x="430" y="172" text-anchor="middle">tampered log → refused (quarantined on the server)</text></svg><figcaption>A restart doesn&#x27;t reset anything. Guard::open verifies the log, then replays it into the same state it had before.</figcaption></figure>
