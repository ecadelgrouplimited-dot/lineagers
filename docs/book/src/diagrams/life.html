<figure class="lx-fig"><svg viewBox="0 0 860 250" role="img" aria-label="An action is requested, then either denied, held pending approval, or allowed; pending actions are approved (re-checked) or rejected; allowed actions end with a reported outcome."><defs><marker id="life-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker><marker id="life-aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkok" d="M0 0L10 5L0 10z"/></marker><marker id="life-abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkbad" d="M0 0L10 5L0 10z"/></marker><marker id="life-aacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="20" y="100" width="130" height="40" rx="20.0"/><text class="t" x="85.0" y="124.5" text-anchor="middle">requested</text><rect class="bacc" x="250" y="30" width="170" height="40" rx="20.0"/><text class="t" x="335.0" y="54.5" text-anchor="middle">pending_approval</text><rect class="bbad" x="250" y="170" width="130" height="40" rx="20.0"/><text class="t" x="315.0" y="194.5" text-anchor="middle">denied</text><rect class="bok" x="520" y="100" width="130" height="40" rx="20.0"/><text class="t" x="585.0" y="124.5" text-anchor="middle">allowed</text><rect class="bok" x="720" y="100" width="120" height="40" rx="20.0"/><text class="t" x="780.0" y="124.5" text-anchor="middle">completed</text><polyline class="l" points="150,112 246,56" marker-end="url(#life-a)"/><text class="s" x="170" y="72" text-anchor="start">needs a human</text><polyline class="l" points="150,128 246,186" marker-end="url(#life-a)"/><text class="s" x="160" y="176" text-anchor="start">a check fails</text><polyline class="l" points="150,120 516,120" marker-end="url(#life-a)"/><text class="s" x="460" y="112" text-anchor="middle">checks pass</text><polyline class="ok" points="420,50 560,50 580,96" marker-end="url(#life-aok)"/><text class="s" x="470" y="42" text-anchor="middle">approved + re-checked</text><polyline class="bad" points="335,70 335,166" marker-end="url(#life-abad)"/><text class="s" x="343" y="150" text-anchor="start">rejected</text><polyline class="l" points="650,120 716,120" marker-end="url(#life-a)"/><text class="s" x="683" y="110" text-anchor="middle">outcome</text><text class="s" x="780" y="162" text-anchor="middle">success · failure · harmful</text></svg><figcaption>The states an action moves through. Every transition is one signed record in the agent&#x27;s log.</figcaption></figure>
