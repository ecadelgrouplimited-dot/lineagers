<figure class="lx-fig"><svg viewBox="0 0 860 320" role="img" aria-label="Anatomy of a guarded app: the model proposes tool calls; the loop asks the guard; a reviewer checks what the policy holds back; the tool backend re-checks the approval; a monitor filters tool output and reports harm; everything is logged."><defs><marker id="anatomy-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker><marker id="anatomy-aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkok" d="M0 0L10 5L0 10z"/></marker><marker id="anatomy-abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkbad" d="M0 0L10 5L0 10z"/></marker><marker id="anatomy-aacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="20" y="60" width="112" height="70" rx="8"/><text class="t tb" x="76.0" y="91.0" text-anchor="middle">Model</text><text class="s" x="76.0" y="108.0" text-anchor="middle">LLM or script</text><rect class="b" x="197" y="60" width="112" height="70" rx="8"/><text class="t tb" x="253.0" y="91.0" text-anchor="middle">Agent loop</text><text class="s" x="253.0" y="108.0" text-anchor="middle">your code</text><rect class="ba" x="374" y="60" width="112" height="70" rx="8"/><text class="t tb" x="430.0" y="91.0" text-anchor="middle">Guard</text><text class="s" x="430.0" y="108.0" text-anchor="middle">policy decides</text><rect class="b" x="551" y="60" width="112" height="70" rx="8"/><text class="t tb" x="607.0" y="91.0" text-anchor="middle">Reviewer</text><text class="s" x="607.0" y="108.0" text-anchor="middle">rules, model, human</text><rect class="b" x="728" y="60" width="112" height="70" rx="8"/><text class="t tb" x="784.0" y="91.0" text-anchor="middle">Backend</text><text class="s" x="784.0" y="108.0" text-anchor="middle">re-checks</text><polyline class="l" points="132,84 193,84" marker-end="url(#anatomy-a)"/><text class="s" x="164.5" y="50" text-anchor="middle">tool call</text><polyline class="l" points="309,84 370,84" marker-end="url(#anatomy-a)"/><text class="s" x="341.5" y="50" text-anchor="middle">request</text><polyline class="l" points="486,84 547,84" marker-end="url(#anatomy-a)"/><text class="s" x="518.5" y="50" text-anchor="middle">pending</text><polyline class="l" points="663,84 724,84" marker-end="url(#anatomy-a)"/><text class="s" x="695.5" y="50" text-anchor="middle">allowed</text><polyline class="l" points="197,110 136,110" marker-end="url(#anatomy-a)"/><text class="s" x="164.5" y="150" text-anchor="middle">result or denial</text><rect class="b" x="197" y="210" width="112" height="70" rx="8"/><text class="t tb" x="253.0" y="241.0" text-anchor="middle">Monitor</text><text class="s" x="253.0" y="258.0" text-anchor="middle">redact, report harm</text><rect class="b" x="374" y="210" width="112" height="70" rx="8"/><text class="t tb" x="430.0" y="241.0" text-anchor="middle">Signed log</text><text class="s" x="430.0" y="258.0" text-anchor="middle">every step</text><rect class="b" x="551" y="210" width="289" height="70" rx="8"/><text class="t tb" x="695.5" y="241.0" text-anchor="middle">Tests</text><text class="s" x="695.5" y="258.0" text-anchor="middle">scripted model + real guard server</text><polyline class="l" points="253,130 253,204" marker-end="url(#anatomy-a)"/><text class="s" x="206" y="172" text-anchor="end">tool output</text><polyline class="l" points="430,130 430,204" marker-end="url(#anatomy-a)"/><polyline class="l" points="309,245 368,245" marker-end="url(#anatomy-a)"/><text class="s" x="338" y="237" text-anchor="middle">harm</text></svg><figcaption>The pieces of a production agent, and where each check happens.</figcaption></figure>
