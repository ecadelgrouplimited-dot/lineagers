xt class="s mono" x="80" y="252" text-anchor="start">audit.key</text><text class="s" x="210" y="252" text-anchor="start">signing key</text><text class="s mono" x="80" y="274" text-anchor="start">my-bot.jsonl</text><text class="s" x="210" y="274" text-anchor="start">signed log</text><polyline class="l" points="290,144 290,196" marker-end="url(#layouts-a)"/><text class="s" x="330" y="176" text-anchor="middle">writes</text><text class="t tb" x="650" y="26" text-anchor="middle">Over HTTP: lineage new my-bot --template python</text><rect class="b" x="470" y="50" width="170" height="110" rx="8"/><text class="t tb" x="555.0" y="101.0" text-anchor="middle">agent.py</text><text class="s" x="555.0" y="118.0" text-anchor="middle">policy.json · model.py</text><rect class="ba" x="680" y="50" width="160" height="110" rx="8"/><text class="t tb" x="760.0" y="101.0" text-anchor="middle">guard-server</text><text class="s" x="760.0" y="118.0" text-anchor="middle">:9200 + console</text><polyline class="l" points="640,92 676,92" marker-end="url(#layouts-a)"/><text class="s" x="658.0" y="85.0" text-anchor="middle">HTTP</text><polyline class="l" points="676,126 644,126" marker-end="url(#layouts-a)"/><rect class="b" x="560" y="200" width="280" height="100" rx="8"/><text class="t tb" x="700.0" y="255.0" text-anchor="middle"></text><text class="t mono" x="580" y="226" text-anchor="start">guard-data/</text><text class="s mono" x="600" y="252" text-anchor="start">keys/</text><text class="s" x="680" y="252" text-anchor="start">audit, token, admin</text><text class="s mono" x="600" y="274" text-anchor="start">agents/</text><text class="s" x="680" y="274" text-anchor="start">my-bot.jsonl, …</text><polyline class="l" points="760,160 760,196" marker-end="url(#layouts-a)"/><text class="s" x="800" y="184" text-anchor="middle">writes</text></svg><figcaption>In-process (Rust) or over HTTP (any language). Same guard, same log format, same guarantees.</figcaption></figure>
