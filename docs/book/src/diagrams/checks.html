<figure class="lx-fig"><svg viewBox="0 0 860 250" role="img" aria-label="The guard checks, in order: is the agent terminated, is the tool allowed, is the tool&#x27;s call cap reached, is the rate limit reached, is there enough budget, does it need approval. The first failure denies the request."><defs><marker id="checks-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M0 0L10 5L0 10z"/></marker><marker id="checks-aok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkok" d="M0 0L10 5L0 10z"/></marker><marker id="checks-abad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkbad" d="M0 0L10 5L0 10z"/></marker><marker id="checks-aacc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mkacc" d="M0 0L10 5L0 10z"/></marker></defs><rect class="b" x="20" y="40" width="124" height="56" rx="8"/><text class="t tb" x="82.0" y="73.0" text-anchor="middle">alive?</text><polyline class="bad" points="82,96 82,150" marker-end="url(#checks-abad)"/><text class="s mono" x="82" y="170" text-anchor="middle">terminated</text><text class="s" x="82" y="188" text-anchor="middle">no scar</text><polyline class="l" points="144,68 158,68" marker-end="url(#checks-a)"/><rect class="b" x="160" y="40" width="124" height="56" rx="8"/><text class="t tb" x="222.0" y="73.0" text-anchor="middle">tool allowed?</text><polyline class="bad" points="222,96 222,150" marker-end="url(#checks-abad)"/><text class="s mono" x="222" y="170" text-anchor="middle">tool_not_allowed</text><text class="s" x="222" y="188" text-anchor="middle">moderate</text><polyline class="l" points="284,68 298,68" marker-end="url(#checks-a)"/><rect class="b" x="300" y="40" width="124" height="56" rx="8"/><text class="t tb" x="362.0" y="73.0" text-anchor="middle">call cap?</text><polyline class="bad" points="362,96 362,150" marker-end="url(#checks-abad)"/><text class="s mono" x="362" y="170" text-anchor="middle">tool_call_limit</text><text class="s" x="362" y="188" text-anchor="middle">minor</text><polyline class="l" points="424,68 438,68" marker-end="url(#checks-a)"/><rect class="b" x="440" y="40" width="124" height="56" rx="8"/><text class="t tb" x="502.0" y="73.0" text-anchor="middle">rate limit?</text><polyline class="bad" points="502,96 502,150" marker-end="url(#checks-abad)"/><text class="s mono" x="502" y="170" text-anchor="middle">rate_limited</text><text class="s" x="502" y="188" text-anchor="middle">minor</text><polyline class="l" points="564,68 578,68" marker-end="url(#checks-a)"/><rect class="b" x="580" y="40" width="124" height="56" rx="8"/><text class="t tb" x="642.0" y="73.0" text-anchor="middle">budget?</text><polyline class="bad" points="642,96 642,150" marker-end="url(#checks-abad)"/><text class="s mono" x="642" y="170" text-anchor="middle">insufficient_budget</text><text class="s" x="642" y="188" text-anchor="middle">no scar</text><polyline class="l" points="704,68 718,68" marker-end="url(#checks-a)"/><rect class="ba" x="720" y="40" width="120" height="56" rx="8"/><text class="t tb" x="780.0" y="73.0" text-anchor="middle">approval?</text><polyline class="acc" points="780,96 780,150" marker-end="url(#checks-aacc)"/><text class="s mono" x="780" y="170" text-anchor="middle">pending_approval</text><text class="s" x="780" y="188" text-anchor="middle">waits for a human</text><text class="t okt" x="430" y="226" text-anchor="middle">all pass → allowed, budget charged</text></svg><figcaption>Checks run in this order and the first failure wins. The scar each denial leaves is shown underneath.</figcaption></figure>
